# native・Cordova共通の静的解析ルール。デフォルト設定へ重ね、1件の違反でも失敗させる。
build:
  maxIssues: 0
  excludeCorrectable: false
  weights:
    complexity: 1
    LongParameterList: 1
    style: 1
    comments: 1

# YAMLの設定項目を検証する。未知のキーを黙って無視してルールを無効化しないための設定。
config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false
  excludes: ""

# 処理統計とコンソール・HTML向け出力を有効にする。出力形式と保存先はKotlin DSL側で指定する。
processors:
  active: true

console-reports:
  active: true

output-reports:
  active: true

# コメント関連の標準ルールを使う。処理概要の十分さはAGENTS.mdに従ってレビューする。
comments:
  active: true

# 引数数・関数数・長い処理などを検出する。Composableを考慮した閾値と例外を個別に設定する。
complexity:
  active: true
  CognitiveComplexMethod:
    active: false
  NamedArguments:
    active: true
    threshold: 3
  # Composeのデフォルト引数を考慮し、関数の引数上限を10にする。
  LongParameterList:
    active: true
    functionThreshold: 10
    ignoreDefaultParameters: true
  TooManyFunctions:
    active: true
    thresholdInClasses: 15
    ignoreAnnotatedFunctions: ["Preview"]
  LongMethod:
    active: true
    threshold: 150

# 非同期処理・空ブロック・例外の扱いに関する標準ルールを適用する。
coroutines:
  active: true
  # 合意した追加ルール。寿命を管理できないGlobalScope.launch／asyncの使用を検出する。
  GlobalCoroutineUsage:
    active: true

empty-blocks:
  active: true

exceptions:
  active: true
  ObjectExtendsThrowable:
    active: true
  TooGenericExceptionCaught:
    active: false

# Kotlinの命名を確認しつつ、Composableの大文字開始名を許容する。
naming:
  active: true
  # Composableには通常関数と異なる命名規約を適用する。
  FunctionNaming:
    active: true
    functionPattern: "[a-zA-Z][a-zA-Z0-9]*"
    ignoreAnnotated: ["Composable"]
  TopLevelPropertyNaming:
    active: true
    constantPattern: "([A-Z][_A-Z0-9]*|[A-Z][A-Za-z0-9]*)"

# 性能面と潜在バグのルールを適用する。型解決が必要なルールはclasspathのない解析では検査されない。
performance:
  active: true

potential-bugs:
  active: true
  CastNullableToNonNullableType:
    active: true
  CastToNullableType:
    active: true
  Deprecation:
    active: true
  DontDowncastCollectionTypes:
    active: true
  ElseCaseInsteadOfExhaustiveWhen:
    active: true
    ignoredSubjectTypes: []
  ExitOutsideMain:
    active: true
  ImplicitUnitReturnType:
    active: true
  LateinitUsage:
    active: true
  NullCheckOnMutableProperty:
    active: true
  NullableToStringCall:
    active: true
  PropertyUsedBeforeDeclaration:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true
  UnnecessaryNotNullCheck:
    active: true
  UnsafeCallOnNullableType:
    active: true

# 曖昧な記述や冗長な構文を検出する。可読性・不変性をルール単位で調整する。
style:
  active: true
  BracesOnIfStatements:
    active: true
    singleLine: "necessary"
    multiLine: "always"
  BracesOnWhenStatements:
    active: true
    singleLine: "necessary"
    multiLine: "necessary"
  CanBeNonNullable:
    active: true
  CascadingCallWrapping:
    active: true
    includeElvis: true
  ClassOrdering:
    active: true
  CollapsibleIfStatements:
    active: true
  DoubleNegativeLambda:
    active: true
    negativeFunctions:
      - reason: "Use `takeIf` instead."
        value: "takeUnless"
      - reason: "Use `all` instead."
        value: "none"
    negativeFunctionNameParts:
      - "not"
      - "non"
  # data classのvarを検出する。valが参照するオブジェクトの深い不変性まで保証するルールではない。
  DataClassShouldBeImmutable:
    active: true
  EqualsOnSignatureLine:
    active: true
  ExplicitCollectionElementAccessMethod:
    active: true
  ExplicitItLambdaParameter:
    active: true
  ExpressionBodySyntax:
    active: true
    includeLineWrapping: false
  ForbiddenAnnotation:
    active: true
  ForbiddenImport:
    active: true
  ForbiddenMethodCall:
    active: true
  ForbiddenSuppress:
    active: true
    rules: []
  ForbiddenComment:
    allowedPatterns: "TODO*"
  MandatoryBracesLoops:
    active: true
  MultilineLambdaItParameter:
    active: true
  NoTabs:
    active: true
  NullableBooleanCheck:
    active: true
  OptionalUnit:
    active: true
  PreferToOverPairSyntax:
    active: true
  SpacingBetweenPackageAndImports:
    active: true
  StringShouldBeRawString:
    active: true
    maxEscapedCharacterCount: 2
    ignoredCharacters: []
  TrailingWhitespace:
    active: true
  ReturnCount:
    active: true
    max: 5
  DestructuringDeclarationWithTooManyEntries:
    active: true
    maxDestructuringEntries: 7
  # UIの定数や宣言的な記述を過剰に指摘しないため、この2ルールは無効化する。
  MagicNumber:
    active: false
  UnusedPrivateMember:
    active: false

# detekt-twitter-composeのルール。Composableの状態・引数・命名・ViewModelの扱いを検査する。
TwitterCompose:
  CompositionLocalAllowlist:
    active: true
  CompositionLocalNaming:
    active: true
  ContentEmitterReturningValues:
    active: true
  ModifierComposable:
    active: false
  ModifierMissing:
    active: false
  ModifierReused:
    active: false
  ModifierWithoutDefault:
    active: false
  MultipleEmitters:
    active: true
  MutableParams:
    active: true
  ComposableNaming:
    active: true
  ComposableParamOrder:
    active: true
  PreviewNaming:
    active: true
  PreviewPublic:
    active: true
  RememberMissing:
    active: true

  # Composableへ通常のList・Set・Mapを渡す箇所を検出し、不変コレクションなどの利用を促す。
  UnstableCollections:
    active: true
  ViewModelForwarding:
    active: true
  ViewModelInjection:
    active: true
