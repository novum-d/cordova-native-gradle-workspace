# 整形専用の設定。buildUponDefaultConfig=falseのため、対象ルールとautoCorrectを明示する。
# 実際に書き換えるかはタスクのautoCorrectが決め、読み取り専用checkでも同じルールを使う。
formatting:
  active: true
  android: true
  autoCorrect: true
  ClassName:
    active: true
    autoCorrect: true
  ContextReceiverMapping:
    active: true
    autoCorrect: true
  DiscouragedCommentLocation:
    active: true
    autoCorrect: true
  EnumWrapping:
    active: true
    autoCorrect: true
  # 複数引数の関数宣言、波括弧、リストの空行を統一する。
  FunctionSignature:
    active: true
    autoCorrect: true
    forceMultilineWhenParameterCountGreaterOrEqualThan: 2
  IfElseBracing:
    active: true
    autoCorrect: true
  NoBlankLineInList:
    active: true
    autoCorrect: true
  NoConsecutiveComments:
    active: true
    autoCorrect: true
  NoSingleLineBlockComment:
    active: false
  TryCatchFinallySpacing:
    active: true
    autoCorrect: true
  TypeArgumentListSpacing:
    active: true
    autoCorrect: true
  TypeParameterListSpacing:
    active: true
    autoCorrect: true
  # 宣言の末尾カンマ・インデント・行長・空白をそろえる。
  TrailingCommaOnDeclarationSite:
    active: true
    autoCorrect: true
  Indentation:
    active: true
    autoCorrect: true
    indentSize: 4
  MaximumLineLength:
    active: true
    autoCorrect: true
    maxLineLength: 120
    ignoreBackTickedIdentifier: true
    excludePackageStatements: true
    excludeImportStatements: true
  NoTrailingSpaces:
    active: true
    autoCorrect: true
  # 自動修正だけでは解消できないワイルドカードimportも、残存違反として拒否する。
  NoWildcardImports:
    active: true
    autoCorrect: true
  ParameterListWrapping:
    active: true
    autoCorrect: true
  SpacingAroundColon:
    active: true
    autoCorrect: true
  SpacingAroundComma:
    active: true
    autoCorrect: true
