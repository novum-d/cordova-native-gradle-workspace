# Cordovaと共有するビルド基盤、アプリ依存、検証・文書化ツールの版を管理する。
[versions]
# Cordova Android 14とそろえる基盤。SDK・JVM targetも両ホストから同じ値を参照する。
cordova-android = "14.0.1"
gradle = "8.13"
agp = "8.7.3"
kotlin = "1.9.24"
compose-compiler = "1.5.14"
build-tools = "35.0.0"
compile-sdk = "35"
target-sdk = "35"
min-sdk = "24"
jvm-target = "11"
# UI・通信・永続化などの採用版。互換性の選定理由はREADMEの表で管理する。
compose-bom = "2025.07.00"
core = "1.16.0"
activity = "1.10.1"
lifecycle = "2.8.7"
# Kotlin 1.9.24・Serialization 1.6.3で型付きルートを使えるNavigation 2.8系を採用する。
navigation = "2.8.9"
webkit = "1.12.1"
datastore = "1.1.7"
serialization = "1.6.3"
coroutines = "1.8.1"
collections-immutable = "0.3.8"
datetime = "0.6.2"
work = "2.10.5"
retrofit = "2.11.0"
okhttp = "4.12.0"
result = "2.0.1"
hilt = "2.52"
# Kotlin 1.9系とNavigation 2.8系でHiltのViewModelを取得するCompose連携。
androidx-hilt = "1.2.0"
ksp = "1.9.24-1.0.20"
timber = "5.0.1"
# 共有Libraryから、Cordova・開発用APKの起動時にTimberを初期化する。
startup = "1.2.0"
# テスト・品質チェック・文書化・Git連携のツール。アプリの通常依存とは用途を分ける。
junit = "4.13.2"
jacoco = "0.8.14"
test-core = "1.7.0"
test-junit = "1.3.0"
detekt = "1.23.8"
dokka = "2.2.0"
twitter-compose-rules = "0.0.26"
jgit = "7.8.0.202609011348-r"

# feature・dataで利用するアプリ・テスト依存。ビルドツールは末尾で分ける。
[libraries]
# プラグイン編集用モジュールのcompileOnly。APK側は既存CordovaLibを使う。
cordova-framework = { module = "org.apache.cordova:framework", version.ref = "cordova-android" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-startup-runtime = { module = "androidx.startup:startup-runtime", version.ref = "startup" }
# ComposeはBOMで版をそろえ、各Artifactへ個別版を付けない。
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-foundation-layout = { module = "androidx.compose.foundation:foundation-layout" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
# 画面とLifecycle、Cordova側と版をそろえるWebKit。
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# 各画面のViewModelでNavigation引数を受け取り、再生成後も復元する。
androidx-lifecycle-viewmodel-savedstate = { module = "androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
# 文字列ルートを組み立てず、Serializableな画面引数で遷移する。
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
# 永続化・非同期・日時・通信など、feature/dataの役割に応じて各モジュールへ宣言する。
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
datastore-core = { module = "androidx.datastore:datastore-core", version.ref = "datastore" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collections-immutable" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
kotlin-result = { module = "com.michael-bull.kotlin-result:kotlin-result", version.ref = "result" }
# Hiltの本体とコード生成用Compilerは同じ版を使う。
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidx-hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
# ローカルJVMテストとAndroidテストの支援ライブラリ。Coroutines Testは本体のcoroutines版を使う。
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-core-ktx = { module = "androidx.test:core-ktx", version.ref = "test-core" }
androidx-test-ext-junit-ktx = { module = "androidx.test.ext:junit-ktx", version.ref = "test-junit" }

# detektの解析時だけに使うルールPlugin。アプリのimplementationへは追加しない。
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
detekt-twitter-compose = { module = "com.twitter.compose.rules:detekt", version.ref = "twitter-compose-rules" }

# 共通の型・非同期処理・ログ・DIを両Libraryのapiで公開する。Processorとテスト依存は含めない。
[bundles]
native-common = [
    "kotlinx-coroutines-core",
    "kotlinx-coroutines-android",
    "kotlinx-collections-immutable",
    "kotlinx-datetime",
    "kotlin-result",
    "hilt-android",
    "timber",
]

# Pluginの版も上の定義を参照し、native・Cordovaの両ホストで共有する。
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
