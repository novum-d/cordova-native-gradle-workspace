// Applied to the Cordova APK host. Inspect external artifacts without resolving
// Android project artifacts, whose outgoing variants depend on the build task.
import groovy.json.JsonOutput
import java.security.MessageDigest
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ProjectComponentIdentifier

def workspace = new File(rootDir, '../../..').canonicalFile
def inventory = layout.buildDirectory.file('reports/licenses/runtime-artifacts.json')

def exportInventory = tasks.register('exportThirdPartyInventory') {
    group = 'verification'
    description = 'Exports resolved debug/release runtime coordinates and SHA-256 hashes for license review.'
    doLast {
        def variants = ['debug', 'release'].collectEntries { variant ->
            def artifacts = configurations.getByName("${variant}RuntimeClasspath").incoming.artifactView {
                componentFilter { !(it instanceof ProjectComponentIdentifier) }
            }.artifacts.artifacts
            def rows = artifacts.collect { artifact ->
                if (!(artifact.id.componentIdentifier instanceof ModuleComponentIdentifier)) {
                    throw new GradleException("License review required for local artifact: ${artifact.file.name}")
                }
                [coordinate: artifact.id.componentIdentifier.displayName,
                 path: artifact.file.absolutePath,
                 sha256: MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()]
            }.unique { [it.coordinate, it.sha256] }.sort { it.coordinate }
            [(variant): rows]
        }
        def output = inventory.get().asFile
        output.parentFile.mkdirs()
        output.text = JsonOutput.prettyPrint(JsonOutput.toJson(variants)) + '\n'
        println "License inventory: ${output}"
    }
}

def verifyLicenses = tasks.register('verifyThirdPartyLicenses', Exec) {
    group = 'verification'
    description = 'Rejects unreviewed runtime dependencies and missing or stale license notices.'
    dependsOn(exportInventory)
    workingDir(workspace)
    commandLine('sh', new File(workspace, 'scripts/licenses.sh'), 'check', inventory.get().asFile,
        new File(projectDir, 'src/main/assets/www'))
}

tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn(verifyLicenses) }
