<!doctype html>
<!-- 固定assetsでWebMessageの双方向通信を検証する。Vueや実NFCの実装は含めない。 -->
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-HFHiE3E5AJOqdIoz5DFggsKe6x35Lmktm0JSmGtmUso='; connect-src https://jsonplaceholder.typicode.com; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
  <title>WebView通信の検証</title>
</head>
<body>
  <h2>Web側の検証ページ</h2>
  <p id="connection" role="status">通信初期化中</p>
  <button id="fetch-user" type="button" disabled>API実行</button>
  <h3>APIレスポンス</h3>
  <pre id="api-result">未取得</pre>
  <h3>NFCイベント</h3>
  <p id="nfc-result">未受信</p>
  <p id="event-count">CustomEvent発火回数: 0</p>
  <script>
'use strict';

/** ページごとの識別子を使い、前のページに対する返信を表示しない。 */
(() => {
  const session = new URLSearchParams(window.location.search).get('session');
  const bridge = window.NativeBridge;
  const connection = document.getElementById('connection');
  const fetchButton = document.getElementById('fetch-user');
  const apiResult = document.getElementById('api-result');
  let connected = false;
  let eventCount = 0;
  let pendingFetch = null;

  /** 通信方式はNativeBridgeだけとし、ユーザー入力を実行コードとして送らない。 */
  function send(type, payload = {}) {
    bridge.postMessage(JSON.stringify({type, payload, session}));
  }

  /** fetchの入力とネイティブ側の表示契約を一致させる。表示にはtextContentだけを使う。 */
  function validUser(user) {
    return user && Number.isInteger(user.id) && user.id > 0 && user.id <= 2147483647 &&
      typeof user.name === 'string' && user.name.trim().length > 0 && user.name.length <= 256 &&
      !/[\u0000-\u001f\u007f-\u009f]/u.test(user.name);
  }

  /** 返信から独立した購読処理で、CustomEventが実際に発火したことを表示する。 */
  window.addEventListener('native:nfcDetected', (event) => {
    eventCount += 1;
    document.getElementById('nfc-result').textContent = `タグID: ${event.detail.tagId}`;
    document.getElementById('event-count').textContent = `CustomEvent発火回数: ${eventCount}`;
  });

  /** 検証APIだけを呼び出し、Cookie・リダイレクトを使わず、失敗やタイムアウトを画面へ返す。 */
  fetchButton.addEventListener('click', async () => {
    if (!connected || pendingFetch) return;
    fetchButton.disabled = true;
    pendingFetch = new AbortController();
    const timeout = setTimeout(() => pendingFetch?.abort(), 10000);
    try {
      const response = await fetch('https://jsonplaceholder.typicode.com/users/1', {
        credentials: 'omit', redirect: 'error', signal: pendingFetch.signal
      });
      if (!response.ok) throw new Error('HTTP error');
      const body = await response.text();
      if (body.length > 65536) throw new Error('Response too large');
      const user = JSON.parse(body);
      if (!validUser(user)) throw new Error('Invalid user');
      apiResult.textContent = JSON.stringify({id: user.id, name: user.name}, null, 2);
      send('USER_FETCHED', {id: user.id, name: user.name});
    } catch (_) {
      apiResult.textContent = 'API通信に失敗しました。通信環境を確認して再実行してください。';
    } finally {
      clearTimeout(timeout);
      pendingFetch = null;
      fetchButton.disabled = !connected;
    }
  });

  /** ページを離れる際に、この文書へ紐づく非同期通信を中止する。 */
  window.addEventListener('pagehide', () => {
    connected = false;
    pendingFetch?.abort();
  });

  if (!bridge || !session) {
    connection.textContent = 'このWebViewは通信APIに対応していません';
    return;
  }

  /** ネイティブの受付確認後に接続済みとし、固定形式の疑似イベントだけを購読者へ通知する。 */
  bridge.onmessage = (event) => {
    try {
      if (typeof event.data !== 'string' || event.data.length > 16384) throw new Error('Invalid message');
      const message = JSON.parse(event.data);
      if (message.session !== session || !message.payload) return;
      if (message.type === 'CONNECTED') {
        connected = true;
        connection.textContent = '接続済み（READY受付確認）';
        fetchButton.disabled = false;
      } else if (connected && message.type === 'NFC_DETECTED' && message.payload.tagId === 'ABC123') {
        window.dispatchEvent(new CustomEvent('native:nfcDetected', {detail: message.payload}));
      }
    } catch (_) {
      console.warn('Invalid native message');
    }
  };
  connection.textContent = 'READY受付待ち';
  send('READY');
})();
  </script>
</body>
</html>
